<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brusnika.LMS</title>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; }

    html, body { height: 100%; }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: #6b7280;
      font-size: 13px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      padding: 24px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }

    #error strong { color: #dc2626; font-size: 14px; }
    #error a { color: #16a34a; text-decoration: none; }

    #lms-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }

    #dbg {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: #0f0; font: 10px monospace;
      padding: 4px 6px; max-height: 80px; overflow-y: auto; z-index: 9999;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <span>Opening Brusnika.LMS…</span>
  </div>

  <div id="error">
    <strong>Cannot open Brusnika.LMS</strong>
    <span id="error-msg">SSO authentication failed.</span>
    <a href="https://brusnika-lms.com/" target="_blank">Get help →</a>
  </div>

  <iframe id="lms-frame" allow="fullscreen"></iframe>
  <div id="dbg"></div>

  <script>
    const LMS_URL = 'https://sa.us.brusnika-apps.com';

    function log(msg) {
      const d = document.getElementById('dbg');
      if (d) d.innerHTML += msg + '<br>';
      console.log('[ZAF]', msg);
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const errEl = document.getElementById('error');
      errEl.style.display = 'flex';
      if (msg) document.getElementById('error-msg').textContent = msg;
    }

    function showFrame(url) {
      document.getElementById('loading').style.display = 'none';
      const frame = document.getElementById('lms-frame');
      frame.style.display = 'block';
      frame.src = url;
    }

    async function hmacSha256(secret, message) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        'raw', enc.encode(secret),
        { name: 'HMAC', hash: 'SHA-256' },
        false, ['sign']
      );
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
      return Array.from(new Uint8Array(sig))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function init() {
      log('init start');
      const client = ZAFClient.init();
      if (!client) { showError('ZAF SDK not available.'); return; }
      log('ZAFClient ok');

      let metadata, userData;
      try {
        [metadata, userData] = await Promise.all([
          client.metadata(),
          client.get('currentUser'),
        ]);
      } catch (e) {
        log('metadata/user error: ' + e);
        showError('Failed to retrieve user data from Zendesk.');
        return;
      }
      log('metadata ok');

      // zcli serves settings as array [{k:v},...]; production as flat object
      const rawSettings = metadata?.settings;
      const settings = Array.isArray(rawSettings)
        ? Object.assign({}, ...rawSettings)
        : (rawSettings || {});
      log('settings: ' + JSON.stringify(settings).slice(0, 80));
      const ssoSecret = settings.sso_secret || '';
      if (!ssoSecret) {
        showError('SSO Secret not configured. Go to Zendesk Admin → Apps → Brusnika.LMS → Settings.');
        return;
      }
      log('secret ok len=' + ssoSecret.length);

      const user    = userData['currentUser'];
      const agentId = String(user?.id || '');
      const email   = String(user?.email || '');
      const name    = encodeURIComponent(String(user?.name || ''));
      const ts      = String(Math.floor(Date.now() / 1000));
      const isAdmin = (user?.role === 'admin' || user?.role === 'owner') ? '1' : '0';
      log(`user id=${agentId} email=${email} role=${user?.role}`);

      if (!agentId) { showError('Could not determine agent identity.'); return; }

      let sig;
      try {
        const payload = `${agentId}|${email}|${ts}|${isAdmin}`;
        sig = await hmacSha256(ssoSecret, payload);
      } catch (e) {
        showError('Failed to generate SSO signature.');
        return;
      }
      log('sig ok');

      // Pre-flight via ZAF proxy (avoids CORS): verify /api/zendesk-sso before loading iframe
      try {
        const ssoRes = await client.request({
          url: `${LMS_URL}/api/zendesk-sso`,
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ agent_id: agentId, email, name: decodeURIComponent(name), ts, sig, is_admin: isAdmin }),
          dataType: 'json',
          secure: false,
        });
        log('sso: ' + JSON.stringify(ssoRes).slice(0, 160));
        if (!ssoRes?.valid) {
          showError('SSO failed: ' + (ssoRes?.error || JSON.stringify(ssoRes)));
          return;
        }
      } catch (e) {
        const detail = e?.responseText || e?.message || String(e);
        log('sso error: ' + detail.slice(0, 160));
        showError('SSO request failed — see debug bar');
        return;
      }

      const lmsUrl = `${LMS_URL}/index.php?zendesk=Y`
        + `&agent_id=${encodeURIComponent(agentId)}`
        + `&email=${encodeURIComponent(email)}`
        + `&name=${name}`
        + `&ts=${ts}`
        + `&is_admin=${isAdmin}`
        + `&sig=${sig}`;

      log('url: ' + lmsUrl.slice(0, 200));
      log('loading LMS iframe...');
      showFrame(lmsUrl);

      client.invoke('resize', { width: '700px', height: '85vh' });
    }

    // Capture debug messages from the LMS iframe
    window.addEventListener('message', (e) => {
      if (e.data && typeof e.data === 'object' && e.data.zdsk_log) {
        log('lms: ' + e.data.zdsk_log);
      }
    });

    init();
  </script>
</body>
</html>
